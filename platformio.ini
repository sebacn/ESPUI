; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = examples/completeExample
data_dir = data
default_envs = esp32-s3-devkitc-1 ; esp32

[env]
platform = espressif32@6.3.0
framework = arduino
board_build.filesystem = littlefs
lib_extra_dirs = .
lib_deps =
;   bblanchon/ArduinoJson @ ^6.18.5
   bblanchon/ArduinoJson @ ^7.0.4
   https://github.com/bmedici/ESPAsyncWebServer ; Use a fork of the library that has a bugfix for the compile.... https://github.com/esphome/ESPAsyncWebServer/pull/17

lib_ignore =
	ESP Async WebServer	; force the use of the esphome version
	AsyncTCP			; force the use of the esphome version
	LittleFS_esp32		; force the use of the ESP32 built into the core version

; Additional scripts: Usage: see https://github.com/s00500/ESPUI/issues/144#issuecomment-1005135077
;extra_scripts =
;	LittleFSBuilder.py

[env:esp32]
board = esp32dev
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dout
build_flags =
    -D DEBUG_ESPUI

lib_deps =
    ${env.lib_deps}
    me-no-dev/AsyncTCP
upload_speed =  921600
monitor_speed = 115200


[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = 
    -DBOARD_HAS_PSRAM 
    -mfix-esp32-psram-cache-issue
    -D DEBUG_ESPUI
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.prsam_type = opi
upload_speed = 921600
monitor_speed = 115200

lib_deps =
    ${env.lib_deps}
    me-no-dev/AsyncTCP

[env:esp32-s3-devkitc-1-n16r8v]
board = esp32-s3-devkitc-1-n16r8v
build_flags = 
    -DBOARD_HAS_PSRAM 
    -mfix-esp32-psram-cache-issue
    -D DEBUG_ESPUI

build_unflags = 
    -DARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE

upload_speed = 921600
monitor_speed = 115200

lib_deps =
    ${env.lib_deps}
    me-no-dev/AsyncTCP


